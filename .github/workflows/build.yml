name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up MSYS2 compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MSYS2 compiler to PATH
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

      - name: Configure AioDNS source-build toolchain
        shell: pwsh
        run: |
          $go = (Get-Command go.exe -ErrorAction Stop).Source
          $gcc = 'C:\msys64\mingw64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc)) {
            throw "Expected the MSYS2 MinGW-w64 GCC compiler at '$gcc'."
          }

          $goRoot = (& $go env GOROOT).Trim()
          if ([string]::IsNullOrWhiteSpace($goRoot) -or -not (Test-Path -LiteralPath (Join-Path $goRoot 'bin\go.exe'))) {
            throw "The configured Go installation '$go' did not report a usable GOROOT."
          }

          "NETCHX_GO_ROOT=$goRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $go version
          & $gcc --version

      - name: Build and test NetchX AioDNS from source
        shell: pwsh
        run: |
          # Other/aiodns/build.ps1 performs go mod download, go test, and the
          # CGO shared-library build. It has no prebuilt-binary fallback.
          & .\Other\aiodns\build.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $aiodns = Get-Item -LiteralPath .\Other\release\aiodns.bin -ErrorAction Stop
          if ($aiodns.Length -eq 0) {
            throw 'The source-built AioDNS binary is empty.'
          }
          Write-Host "Source-built AioDNS: $($aiodns.FullName) ($($aiodns.Length) bytes)"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build tools
        shell: pwsh
        run: |
          dotnet --info
          go version
          gcc --version
          msbuild -version

      - name: Run managed regression tests
        shell: pwsh
        run: dotnet test .\Tests\Tests.csproj --configuration Release --framework net10.0-windows

      - name: Build complete release layout
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Verify release layout
        shell: pwsh
        run: |
          $requiredFiles = @(
            'NetchX.exe',
            'bin\Redirector.bin',
            'bin\RouteHelper.bin',
            'bin\nfapi.dll',
            'bin\nfdriver.sys',
            'bin\aiodns.bin',
            'bin\pcap2socks.exe',
            'bin\tun2socks.exe',
            'bin\xray.exe',
            'bin\sing-box.exe',
            'bin\libcronet.dll',
            'bin\sing-box.LICENSE',
            'bin\geoip.dat',
            'bin\geosite.dat',
            'bin\wintun.dll',
            'bin\GeoLite2-Country.mmdb'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'release' $_)) })
          if ($missingFiles.Count -gt 0) {
            throw "Build output is incomplete. Missing: $($missingFiles -join ', ')"
          }

      - name: Verify generated release archive
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath .\release -File | Where-Object {
            $_.Name -match '^NetchX-.+-win-x64\.(7z|zip)$'
          })
          if ($archives.Count -ne 1) {
            throw "Expected exactly one generated release archive, found $($archives.Count)."
          }
          Write-Host "Generated archive: $($archives[0].FullName)"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: NetchX-build-${{ github.sha }}
          path: |
            release/NetchX-*-win-x64.7z
            release/NetchX-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
