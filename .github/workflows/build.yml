name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NETCHX_BUILD_V2RAY_FROM_SOURCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up MSYS2 compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MSYS2 compiler to PATH
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build tools
        shell: pwsh
        run: |
          dotnet --info
          go version
          gcc --version
          msbuild -version

      - name: Run managed regression tests
        shell: pwsh
        run: dotnet test .\Tests\Tests.csproj --configuration Release --framework net10.0-windows

      - name: Build complete release layout
        shell: pwsh
        run: .\build.ps1 -Configuration Release -OutputPath build

      - name: Verify release layout
        shell: pwsh
        run: |
          $requiredFiles = @(
            'NetchX.exe',
            'bin\Redirector.bin',
            'bin\RouteHelper.bin',
            'bin\nfapi.dll',
            'bin\nfdriver.sys',
            'bin\aiodns.bin',
            'bin\pcap2socks.exe',
            'bin\tun2socks.exe',
            'bin\xray.exe',
            'bin\v2ray-sn.exe',
            'bin\geoip.dat',
            'bin\geosite.dat',
            'bin\wintun.dll',
            'bin\GeoLite2-Country.mmdb'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'build' $_)) })
          if ($missingFiles.Count -gt 0) {
            throw "Build output is incomplete. Missing: $($missingFiles -join ', ')"
          }

      - name: Upload release layout
        uses: actions/upload-artifact@v4
        with:
          name: NetchX-build-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 14
