name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath .\NetchX\Controllers\UpdateChecker.cs -Raw
          $assemblyVersion = [regex]::Match($source, 'AssemblyVersion\s*=\s*@"(?<value>[^"]+)"')
          $suffix = [regex]::Match($source, 'private const string Suffix\s*=\s*@"(?<value>[^"]*)"')
          if (-not $assemblyVersion.Success -or -not $suffix.Success) {
            throw 'Could not read the application release version from UpdateChecker.cs.'
          }

          $version = $assemblyVersion.Groups['value'].Value
          if ($suffix.Groups['value'].Value) {
            $version = "$version-$($suffix.Groups['value'].Value)"
          }

          if ($env:GITHUB_REF_NAME -ne $version) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version'."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up MSYS2 UCRT64 compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add MSYS2 compiler to PATH
        shell: pwsh
        run: |
          $compilerBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $compilerBin 'gcc.exe'))) {
            throw "The MSYS2 UCRT64 GCC compiler was not installed at '$compilerBin'."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $compilerBin

      - name: Configure AioDNS source-build toolchain
        shell: pwsh
        run: |
          $go = (Get-Command go.exe -ErrorAction Stop).Source
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $gcc = Join-Path $msys2Root 'ucrt64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc)) {
            throw "Expected the MSYS2 UCRT64 GCC compiler at '$gcc'."
          }

          $goRoot = (& $go env GOROOT).Trim()
          if ([string]::IsNullOrWhiteSpace($goRoot) -or -not (Test-Path -LiteralPath (Join-Path $goRoot 'bin\go.exe'))) {
            throw "The configured Go installation '$go' did not report a usable GOROOT."
          }

          "NETCHX_GO_ROOT=$goRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $go version
          & $gcc --version

      - name: Build and test NetchX AioDNS from source
        shell: pwsh
        run: |
          # Other/aiodns/build.ps1 performs go mod download, go test, and the
          # CGO shared-library build. It has no prebuilt-binary fallback.
          $repositoryRoot = $env:GITHUB_WORKSPACE
          & (Join-Path $repositoryRoot 'Other\aiodns\build.ps1')

          $aiodns = Get-Item -LiteralPath (Join-Path $repositoryRoot 'Other\release\aiodns.bin') -ErrorAction Stop
          if ($aiodns.Length -eq 0) {
            throw 'The source-built AioDNS binary is empty.'
          }
          Write-Host "Source-built AioDNS: $($aiodns.FullName) ($($aiodns.Length) bytes)"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build tools
        shell: pwsh
        run: |
          dotnet --info
          go version
          gcc --version
          msbuild -version

      - name: Run managed regression tests
        shell: pwsh
        run: dotnet test .\Tests\Tests.csproj --configuration Release --framework net10.0-windows

      - name: Build complete release layout
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Verify release layout
        shell: pwsh
        run: |
          $requiredFiles = @(
            'NetchX.exe',
            'bin\Redirector.bin',
            'bin\RouteHelper.bin',
            'bin\nfapi.dll',
            'bin\nfdriver.sys',
            'bin\aiodns.bin',
            'bin\pcap2socks.exe',
            'bin\tun2socks.exe',
            'bin\xray.exe',
            'bin\sing-box.exe',
            'bin\libcronet.dll',
            'bin\sing-box.LICENSE',
            'bin\geoip.dat',
            'bin\geosite.dat',
            'bin\wintun.dll',
            'bin\GeoLite2-Country.mmdb'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'release' $_)) })
          if ($missingFiles.Count -gt 0) {
            throw "Release output is incomplete. Missing: $($missingFiles -join ', ')"
          }

      - name: Locate generated release archive
        id: package
        shell: pwsh
        run: |
          $expectedBaseName = "NetchX-$env:RELEASE_VERSION-win-x64"
          $archives = @(Get-ChildItem -LiteralPath .\release -File | Where-Object {
            $_.Name -in @("$expectedBaseName.7z", "$expectedBaseName.zip")
          })
          if ($archives.Count -ne 1) {
            throw "Expected exactly one generated release archive for '$expectedBaseName', found $($archives.Count)."
          }

          $archive = $archives[0]
          $sha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive=$($archive.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_name=$($archive.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          files: ${{ steps.package.outputs.archive }}
          body: |
            ## Changelog

            This release was built and verified by GitHub Actions.

            ## Checksums

            | File name | SHA256 |
            | :- | :- |
            | ${{ steps.package.outputs.archive_name }} | ${{ steps.package.outputs.sha256 }} |
