name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NETCH_BUILD_V2RAY_FROM_SOURCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath .\Netch\Controllers\UpdateChecker.cs -Raw
          $assemblyVersion = [regex]::Match($source, 'AssemblyVersion\s*=\s*@"(?<value>[^"]+)"')
          $suffix = [regex]::Match($source, 'private const string Suffix\s*=\s*@"(?<value>[^"]*)"')
          if (-not $assemblyVersion.Success -or -not $suffix.Success) {
            throw 'Could not read the application release version from UpdateChecker.cs.'
          }

          $version = $assemblyVersion.Groups['value'].Value
          if ($suffix.Groups['value'].Value) {
            $version = "$version-$($suffix.Groups['value'].Value)"
          }

          if ($env:GITHUB_REF_NAME -ne $version) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match application version '$version'."
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up MSYS2 compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MSYS2 compiler to PATH
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show build tools
        shell: pwsh
        run: |
          dotnet --info
          go version
          gcc --version
          msbuild -version

      - name: Run managed regression tests
        shell: pwsh
        run: dotnet test .\Tests\Tests.csproj --configuration Release --framework net10.0-windows

      - name: Build complete release layout
        shell: pwsh
        run: .\build.ps1 -Configuration Release -OutputPath release

      - name: Verify release layout
        shell: pwsh
        run: |
          $requiredFiles = @(
            'Netch.exe',
            'bin\Redirector.bin',
            'bin\RouteHelper.bin',
            'bin\nfapi.dll',
            'bin\nfdriver.sys',
            'bin\aiodns.bin',
            'bin\pcap2socks.exe',
            'bin\tun2socks.exe',
            'bin\xray.exe',
            'bin\v2ray-sn.exe',
            'bin\geoip.dat',
            'bin\geosite.dat',
            'bin\wintun.dll',
            'bin\GeoLite2-Country.mmdb'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'release' $_)) })
          if ($missingFiles.Count -gt 0) {
            throw "Release output is incomplete. Missing: $($missingFiles -join ', ')"
          }

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $archive = "Netch-$env:RELEASE_VERSION-win-x64.zip"
          $packageRoot = Join-Path $env:RUNNER_TEMP 'netch-release-package'
          $payloadRoot = Join-Path $packageRoot 'Netch'
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          Copy-Item -Path .\release\* -Destination $payloadRoot -Recurse -Force
          Compress-Archive -LiteralPath $payloadRoot -DestinationPath $archive -CompressionLevel Optimal

          $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          files: ${{ steps.package.outputs.archive }}
          body: |
            [![](https://img.shields.io/badge/Telegram-Channel-blue)](https://t.me/netch_channel) [![](https://img.shields.io/badge/Telegram-Group-green)](https://t.me/netch_group)

            ## Changelog

            This release was built and verified by GitHub Actions.

            ## Checksums

            | File name | SHA256 |
            | :- | :- |
            | ${{ steps.package.outputs.archive }} | ${{ steps.package.outputs.sha256 }} |
